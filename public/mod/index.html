<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod | Shek Modz</title>
    <script src="/theme.js"></script>
    <script src="/announce.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--bg, #000); color: var(--accent); font-family: 'JetBrains Mono', monospace; }
        .home { z-index: 40; position: fixed; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            border: 1px solid rgba(var(--accent-rgb)/0.4); border-radius: 10px; background: #000; color: var(--accent); text-decoration: none;
            font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 0 10px rgba(var(--accent-rgb)/0.25); transition: all .25s; }
        .home:hover { background: var(--accent); color: #000; box-shadow: 0 0 22px rgba(var(--accent-rgb)/0.7); }
        .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 16px 40px; }
        .card { width: 100%; max-width: 640px; padding: 32px 28px; border: 1px solid rgba(var(--accent-rgb)/0.4); border-radius: 18px;
            background: rgba(10,10,12,.92); box-shadow: 0 0 30px rgba(var(--accent-rgb)/0.3), inset 0 0 18px rgba(var(--accent-rgb)/0.1); }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 11px; }
        .date { opacity: .55; }
        .badge { padding: 5px 12px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .1em; border: 1px solid rgba(var(--accent-rgb)/0.5); }
        .badge.ok { background: var(--accent); color: #000; box-shadow: 0 0 12px rgba(var(--accent-rgb)/0.9); }
        .badge.bad { text-decoration: line-through; opacity: .6; }
        h1 { margin: 0 0 14px; font-size: clamp(22px, 5vw, 34px); line-height: 1.25; text-shadow: 0 0 12px rgba(var(--accent-rgb)/0.8), 0 0 28px rgba(var(--accent-rgb)/0.4); overflow-wrap: anywhere; }
        .desc { margin: 0 0 24px; color: rgb(var(--soft-rgb)); opacity: .8; font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
        .author { padding-top: 16px; margin-bottom: 20px; border-top: 1px solid rgba(var(--accent-rgb)/0.2); font-size: 12px; opacity: .8; }
        .author strong { color: var(--accent); }
        .btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { flex: 1 1 160px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px; cursor: pointer;
            border: 1px solid rgba(var(--accent-rgb)/0.5); background: #000; color: var(--accent); font: 700 12px 'JetBrains Mono', monospace; letter-spacing: .08em;
            text-transform: uppercase; text-decoration: none; transition: all .25s; }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(var(--accent-rgb)/0.6); }
        .msg { text-align: center; font-size: 15px; text-shadow: 0 0 12px rgba(var(--accent-rgb)/0.8); }
    </style>
</head>
<body>
    <a class="home" href="/"><i class="fa-solid fa-house"></i> Home</a>
    <main class="center"><div class="card" id="card"><p class="msg">Loading…</p></div></main>
<script>
(function () {
    var card = document.getElementById('card');
    var esc = function (v) { return String(v).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
    var safeUrl = function (u) { return /^https?:\/\//i.test(u) ? u : (/^[a-z][a-z0-9+.-]*:/i.test(u) ? '#' : encodeURI(u)); };
    var m = location.pathname.match(/^\/mod\/(\d+)\/?$/);

    function missing() {
        document.title = 'Mod not found | Shek Modz';
        card.innerHTML = '<p class="msg">This mod doesn\'t exist or has been taken down.</p>';
    }
    if (!m) return missing();

    fetch('/api/posts/' + m[1], { cache: 'no-store' })
        .then(function (r) { if (r.status === 403) { card.innerHTML = '<p class="msg">Locked: your account is banned, so mods are hidden.</p>'; return 'locked'; } if (r.status === 404) return null; if (!r.ok) throw new Error(); return r.json(); })
        .then(function (p) {
            if (p === 'locked') return;
            if (!p) return missing();
            document.title = p.title + ' | Shek Modz';
            var b = p.status === 'Tested & Working' ? '<span class="badge ok"><i class="fa-solid fa-circle-check"></i> WORKING</span>'
                  : p.status === 'Not Tested' ? '<span class="badge"><i class="fa-solid fa-triangle-exclamation"></i> UNTESTED</span>'
                  : '<span class="badge bad"><i class="fa-solid fa-bug"></i> NOT WORKING</span>';
            card.innerHTML =
                '<div class="row">' + b + '<span class="date">' + esc(p.date) + '</span></div>' +
                '<h1>' + esc(p.title) + '</h1>' +
                '<p class="desc">' + esc(p.desc) + '</p>' +
                '<div class="author">AUTHOR: <strong>' + esc(p.author) + '</strong></div>' +
                '<div class="btns"><a class="btn" target="_blank" rel="noopener noreferrer" href="' + esc(safeUrl(p.fileLink)) + '"><i class="fa-solid fa-download"></i> Get File</a>' +
                '<button class="btn" id="cp"><i class="fa-solid fa-link"></i> Copy Link</button></div>';
            document.getElementById('cp').onclick = function () {
                var btn = this, old = btn.innerHTML;
                function done() { btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied'; setTimeout(function () { btn.innerHTML = old; }, 1400); }
                if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, function () { prompt('Copy this link:', location.href); });
                else prompt('Copy this link:', location.href);
            };
        })
        .catch(function () { card.innerHTML = '<p class="msg">Couldn\'t load this mod. Try refreshing.</p>'; });
})();
</script>
</body>
</html>
