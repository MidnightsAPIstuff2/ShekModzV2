<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devlogs | standy.best</title>
    <style>:root{--accent:#e4e4e7;--accent-rgb:228 228 231;--accent-mid:#a1a1aa;--accent-dark:#52525b;--soft-rgb:212 212 216;--bg:#050506;--bg2:#0a0a0b}</style>
    <script src="/theme.js"></script>
    <script src="/announce.js"></script>
    <script src="/fx.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--accent); font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
        .home { z-index: 40; position: fixed; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            border: 1px solid rgba(var(--accent-rgb)/0.4); border-radius: 10px; background: #000; color: var(--accent); text-decoration: none;
            font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: all .25s; }
        .home:hover { background: var(--accent); color: #000; }
        .wrap { position: relative; z-index: 10; width: 100%; max-width: 760px; margin: 0 auto; padding: 84px 16px 60px; }
        h1 { margin: 0 0 6px; text-align: center; font-size: clamp(26px, 6vw, 40px); text-transform: uppercase; letter-spacing: .12em; text-shadow: 0 0 12px rgba(var(--accent-rgb)/0.7), 0 0 28px rgba(var(--accent-rgb)/0.35); }
        .sub { margin: 0 0 24px; text-align: center; font-size: 12px; opacity: .6; }
        .bar { display: flex; gap: 10px; margin-bottom: 18px; }
        .search { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(var(--accent-rgb)/0.35); background: rgba(5,5,6,.85); color: #fff; font: 13px 'JetBrains Mono', monospace; }
        .search:focus, .field:focus { outline: none; border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(var(--accent-rgb)/0.5);
            background: #000; color: var(--accent); font: 700 12px 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
        .btn:hover { background: var(--accent); color: #000; }
        .btn.solid { background: var(--accent); color: #000; }
        .btn.danger { border-color: rgba(248,113,113,.5); color: #f87171; }
        .btn.danger:hover { background: #f87171; color: #000; }
        .btn.small { padding: 6px 11px; font-size: 11px; border-radius: 9px; }
        .btn:disabled { opacity: .4; cursor: default; }
        .card { margin-bottom: 16px; padding: 22px 22px 18px; border: 1px solid rgba(var(--accent-rgb)/0.3); border-radius: 16px; background: rgba(10,10,12,.88);
            box-shadow: 0 0 22px rgba(var(--accent-rgb)/0.14); }
        .card.flash { border-color: var(--accent); box-shadow: 0 0 30px rgba(var(--accent-rgb)/0.55); }
        .card h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
        .card h2 a { color: inherit; text-decoration: none; }
        .card h2 a:hover { text-decoration: underline; }
        .meta { margin-bottom: 14px; font-size: 11px; opacity: .6; }
        .meta strong { color: var(--accent); opacity: 1; }
        .body { font-size: 13.5px; line-height: 1.75; color: rgb(var(--soft-rgb)); white-space: pre-wrap; overflow-wrap: anywhere; }
        .body a { color: var(--accent); text-decoration: underline; }
        .acts { display: flex; gap: 8px; margin-top: 16px; }
        .field { width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(var(--accent-rgb)/0.4); background: #000; color: #fff; font: 13px 'JetBrains Mono', monospace; }
        textarea.field { min-height: 170px; resize: vertical; line-height: 1.6; }
        label.l { display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; }
        .asname { margin: 0 0 10px; font-size: 12px; opacity: .8; }
        .row { display: flex; gap: 10px; }
        .row .btn { flex: 1; }
        .err { margin: 8px 0 0; color: #f87171; font-size: 12px; }
        .empty { padding: 40px 10px; text-align: center; font-size: 13px; opacity: .55; }
        .more { display: flex; justify-content: center; margin-top: 6px; }
        [hidden] { display: none !important; }
    </style>
    <link href="/shine.css" rel="stylesheet">
</head>
<body>
    <a class="home" href="/"><i class="fa-solid fa-house"></i> Home</a>
    <main class="wrap">
        <h1>Devlogs</h1>
        <p class="sub">Updates and notes from the team</p>

        <div class="bar">
            <input id="q" class="search" type="search" placeholder="Search logs, authors..." maxlength="100" autocomplete="off">
            <button id="newBtn" class="btn solid" type="button" hidden><i class="fa-solid fa-plus"></i> New log</button>
        </div>

        <form id="form" class="card" hidden>
            <p class="asname" id="asName"></p>
            <div id="authorRow" hidden>
                <label class="l" for="fAuthor">Post as (any name)</label>
                <input id="fAuthor" class="field" maxlength="40" placeholder="Owner">
            </div>
            <label class="l" for="fTitle">Title</label>
            <input id="fTitle" class="field" maxlength="120" required placeholder="What's this log about?">
            <label class="l" for="fBody">Log</label>
            <textarea id="fBody" class="field" maxlength="8000" required placeholder="Write the log..."></textarea>
            <div class="row">
                <button class="btn" type="button" id="fCancel">Cancel</button>
                <button class="btn solid" type="submit" id="fSave">Post log</button>
            </div>
            <div class="err" id="fErr" hidden></div>
        </form>

        <div id="list"></div>
        <div class="more"><button id="moreBtn" class="btn" type="button" hidden>Load older logs</button></div>
    </main>
<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var me = { owner: false, name: '', canPost: false };
    var logs = [], more = false, editId = null, term = '', reqN = 0;

    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
    function api(path, opts) {
        opts = opts || {}; opts.credentials = 'same-origin'; opts.cache = 'no-store';
        if (opts.body) opts.headers = { 'Content-Type': 'application/json' };
        return fetch(path, opts).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Something went wrong.'); e.status = r.status; throw e; } return d; });
        });
    }
    function fmt(ms) { return new Date(ms).toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

    /* plain text only; web links become clickable */
    function fill(node, text) {
        var re = /https?:\/\/[^\s<>"']+/g, last = 0, m;
        while ((m = re.exec(text))) {
            var url = m[0].replace(/[.,;:!?)\]]+$/, '');
            if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
            var a = el('a', '', url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
            node.appendChild(a);
            last = m.index + url.length; re.lastIndex = last;
        }
        if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
    }

    function render() {
        var box = $('list'); box.textContent = '';
        if (!logs.length) { box.appendChild(el('div', 'empty', term ? 'No logs match "' + term + '".' : 'No logs yet.')); }
        logs.forEach(function (l) {
            var c = el('article', 'card'); c.id = 'log-' + l.id;
            var h = el('h2'); var a = el('a', '', l.title); a.href = '#log-' + l.id; h.appendChild(a); c.appendChild(h);
            var meta = el('div', 'meta'); meta.appendChild(document.createTextNode('by ')); meta.appendChild(el('strong', '', l.author));
            meta.appendChild(document.createTextNode(' · ' + fmt(l.date) + (l.edited ? ' · edited' : ''))); c.appendChild(meta);
            var b = el('div', 'body'); fill(b, l.body); c.appendChild(b);
            if (l.canEdit) {
                var acts = el('div', 'acts');
                var e = el('button', 'btn small', 'Edit'); e.type = 'button'; e.onclick = function () { openForm(l); };
                var d = el('button', 'btn small danger', 'Delete'); d.type = 'button'; d.onclick = function () { del(l); };
                acts.appendChild(e); acts.appendChild(d); c.appendChild(acts);
            }
            box.appendChild(c);
        });
        $('moreBtn').hidden = !more;
        var h2 = location.hash.match(/^#log-(\d+)$/);
        if (h2 && $('log-' + h2[1])) { var t = $('log-' + h2[1]); t.classList.add('flash'); }
    }

    function load(append) {
        var n = ++reqN;
        var url = '/api/devlogs?q=' + encodeURIComponent(term) + (append && logs.length ? '&before=' + logs[logs.length - 1].id : '');
        return api(url).then(function (d) {
            if (n !== reqN) return;
            logs = append ? logs.concat(d.logs) : d.logs; more = d.more; render();
            if (!append) { var h = location.hash.match(/^#log-(\d+)$/); if (h && $('log-' + h[1])) $('log-' + h[1]).scrollIntoView({ block: 'center' }); }
        }).catch(function () { if (n === reqN) { $('list').textContent = ''; $('list').appendChild(el('div', 'empty', "Couldn't load the logs. Try refreshing.")); } });
    }

    var timer;
    $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { term = $('q').value.trim(); load(false); }, 250); });
    $('moreBtn').onclick = function () { load(true); };

    function openForm(l) {
        editId = l ? l.id : null;
        $('fTitle').value = l ? l.title : ''; $('fBody').value = l ? l.body : '';
        $('authorRow').hidden = !me.owner; $('fAuthor').value = l ? l.author : '';
        $('asName').hidden = me.owner; $('asName').textContent = 'Posting as ' + me.name;
        $('fSave').textContent = l ? 'Save changes' : 'Post log'; $('fErr').hidden = true;
        $('form').hidden = false; $('fTitle').focus(); $('form').scrollIntoView({ block: 'nearest' });
    }
    $('newBtn').onclick = function () { openForm(null); };
    $('fCancel').onclick = function () { $('form').hidden = true; };
    $('form').addEventListener('submit', function (e) {
        e.preventDefault(); $('fErr').hidden = true; $('fSave').disabled = true;
        var body = { title: $('fTitle').value, body: $('fBody').value }; if (me.owner) body.author = $('fAuthor').value;
        api(editId ? '/api/devlogs/' + editId : '/api/devlogs', { method: editId ? 'PUT' : 'POST', body: JSON.stringify(body) })
            .then(function () { $('form').hidden = true; return load(false); })
            .catch(function (err) { $('fErr').textContent = err.message; $('fErr').hidden = false; })
            .then(function () { $('fSave').disabled = false; });
    });
    function del(l) {
        if (!confirm('Delete this log? This cannot be undone.')) return;
        api('/api/devlogs/' + l.id, { method: 'DELETE' }).then(function () { return load(false); }).catch(function (err) { alert(err.message); });
    }

    api('/api/session').then(function (s) {
        me.owner = !!s.owner;
        me.canPost = !!(s.owner || (s.permissions || []).indexOf('devlog') >= 0);
        me.name = s.user ? s.user.username : 'Owner';
        $('newBtn').hidden = !me.canPost;
    }).catch(function () {}).then(function () { return load(false); });
})();
</script>
</body>
</html>
