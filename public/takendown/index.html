<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taken Down | standy.best</title>
    <script src="/theme.js"></script>
    <script src="/announce.js"></script>
    <script src="/fx.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg, #000);
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .home {
            z-index: 40;
            position: fixed;
            top: 16px;
            left: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid rgba(var(--accent-rgb)/0.4);
            border-radius: 10px;
            background: #000;
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(var(--accent-rgb)/0.25);
            transition: all 0.25s;
        }
        .home:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 22px rgba(var(--accent-rgb)/0.7);
        }

        .center {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        h1 {
            margin: 0;
            max-width: 900px;
            font-size: clamp(22px, 4.5vw, 46px);
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0.02em;
            color: var(--accent);
            text-shadow: 0 0 12px rgba(var(--accent-rgb)/0.8), 0 0 28px rgba(var(--accent-rgb)/0.45), 0 0 50px rgba(var(--accent-rgb)/0.25);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }
    </style>
    <link href="/shine.css" rel="stylesheet">
</head>
<body>
    <a class="home" href="/"><i class="fa-solid fa-house"></i> Home</a>
    <main class="center">
        <h1>This is the placeholder link for a taken down APK/Mod</h1>
    </main>
</body>
</html>
