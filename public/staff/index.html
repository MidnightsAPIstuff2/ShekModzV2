<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Team | Shek Modz</title>
    <style>:root{--accent:#22ff66;--accent-rgb:34 255 102;--accent-mid:#14a83c;--accent-dark:#0b5a20;--soft-rgb:187 247 208;--bg:#010502;--bg2:#020a04}</style>
    <script src="/theme.js"></script>
    <script src="/announce.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--accent); font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
        .home { z-index: 40; position: fixed; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            border: 1px solid rgba(var(--accent-rgb)/0.4); border-radius: 10px; background: #000; color: var(--accent); text-decoration: none;
            font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 0 10px rgba(var(--accent-rgb)/0.25); transition: all .25s; }
        .home:hover { background: var(--accent); color: #000; box-shadow: 0 0 22px rgba(var(--accent-rgb)/0.7); }
        .wrap { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 90px 16px 50px; }
        h1 { margin: 0 0 28px; font-size: clamp(26px, 6vw, 40px); text-transform: uppercase; letter-spacing: .12em; text-shadow: 0 0 12px rgba(var(--accent-rgb)/0.85), 0 0 28px rgba(var(--accent-rgb)/0.45); }
        .card { width: 100%; max-width: 520px; padding: 28px 30px; border: 1px solid rgba(var(--accent-rgb)/0.45); border-radius: 18px;
            background: rgba(10,10,12,.92); box-shadow: 0 0 28px rgba(var(--accent-rgb)/0.3), inset 0 0 16px rgba(var(--accent-rgb)/0.1); }
        .group + .group { margin-top: 26px; padding-top: 22px; border-top: 1px solid rgba(var(--accent-rgb)/0.18); }
        h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: .08em; text-shadow: 0 0 10px rgba(var(--accent-rgb)/0.7); overflow-wrap: anywhere; }
        ul { margin: 0; padding: 0; list-style: none; }
        li { padding: 3px 0; font-size: 16px; color: rgb(var(--soft-rgb)); overflow-wrap: anywhere; }
        li::before { content: '\00b7'; margin-right: 10px; color: var(--accent); font-weight: 700; }
        .empty { color: rgb(var(--soft-rgb)); opacity: .5; font-size: 13px; }
        .edit-btn { margin-top: 22px; padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(var(--accent-rgb)/0.5); background: #000; color: var(--accent); cursor: pointer;
            font: 700 12px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; transition: all .2s; }
        .edit-btn:hover { background: var(--accent); color: #000; }
        .editor { width: 100%; max-width: 520px; margin-top: 18px; }
        textarea { width: 100%; min-height: 260px; padding: 14px; border-radius: 12px; border: 1px solid rgba(var(--accent-rgb)/0.5); background: #000; color: #fff; font: 14px/1.6 'JetBrains Mono', monospace; resize: vertical; }
        textarea:focus { outline: none; border-color: var(--accent); }
        .hint { margin: 8px 0 12px; font-size: 11px; opacity: .65; line-height: 1.6; }
        .row { display: flex; gap: 10px; }
        .row button { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid rgba(var(--accent-rgb)/0.5); background: #000; color: var(--accent); cursor: pointer; font: 700 12px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
        .row button.save { background: var(--accent); color: #000; box-shadow: 0 0 16px rgba(var(--accent-rgb)/0.6); }
        .err { margin-top: 10px; color: #f87171; font-size: 12px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <a class="home" href="/"><i class="fa-solid fa-house"></i> Home</a>
    <main class="wrap">
        <h1>Staff Team</h1>
        <div class="card" id="card"><div class="empty">Loading...</div></div>
        <button class="edit-btn" id="editBtn" hidden>Edit team</button>
        <div class="editor" id="editor" hidden>
            <textarea id="staffText" spellcheck="false" maxlength="5000"></textarea>
            <p class="hint">First line = the role. The lines under it = names, one per line. Leave a blank line between roles.</p>
            <div class="row"><button type="button" id="cancelBtn">Cancel</button><button type="button" class="save" id="saveBtn">Save</button></div>
            <div class="err" id="err" hidden></div>
        </div>
    </main>
<script>
(function () {
    var card = document.getElementById('card'), groups = [];
    function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
    function render() {
        card.textContent = '';
        if (!groups.length) { card.appendChild(el('div', 'No staff listed yet.', 'empty')); return; }
        groups.forEach(function (g) {
            var box = el('div', undefined, 'group');
            box.appendChild(el('h2', g.role));
            var ul = el('ul');
            g.members.forEach(function (m) { ul.appendChild(el('li', m)); });
            box.appendChild(ul);
            card.appendChild(box);
        });
    }
    function toText() { return groups.map(function (g) { return [g.role].concat(g.members).join('\n'); }).join('\n\n'); }
    function load() {
        return fetch('/api/staff', { cache: 'no-store' }).then(function (r) { return r.json(); })
            .then(function (d) { groups = d.groups || []; render(); })
            .catch(function () { card.textContent = ''; card.appendChild(el('div', "Couldn't load the team. Try refreshing.", 'empty')); });
    }
    load();

    // the owner gets an Edit button
    var editBtn = document.getElementById('editBtn'), editor = document.getElementById('editor'), ta = document.getElementById('staffText'), err = document.getElementById('err');
    fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json(); })
        .then(function (s) { if (s && s.owner) editBtn.hidden = false; }).catch(function () {});
    editBtn.onclick = function () { ta.value = toText(); err.hidden = true; editor.hidden = false; editBtn.hidden = true; ta.focus(); };
    document.getElementById('cancelBtn').onclick = function () { editor.hidden = true; editBtn.hidden = false; };
    document.getElementById('saveBtn').onclick = function () {
        err.hidden = true;
        fetch('/api/staff', { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: ta.value }) })
            .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not save.'); return d; }); })
            .then(function (d) { groups = d.groups; render(); editor.hidden = true; editBtn.hidden = false; })
            .catch(function (e) { err.textContent = e.message; err.hidden = false; });
    };
})();
</script>
</body>
</html>
